[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ethcode"
version = "0.2.3"
description = "Collect, compare, and cache smart-contract source and bytecode artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Gernot Salzer"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
dataset = ["duckdb>=1.1,<3"]
test = ["pytest>=8"]

[project.scripts]
ethcode-fill-etherscan = "ethcode.tools.fill_etherscan_cache:main"
ethcode-fill-sourcify = "ethcode.tools.fill_sourcify_cache:main"

[project.urls]
Repository = "https://github.com/gsalzer/ethcode"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ethcode = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

